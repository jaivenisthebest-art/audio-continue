<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Phone Audio Continue (Termux Demo)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { font-family: system-ui, -apple-system, Roboto, sans-serif; padding: 1rem; }
    .box { max-width:600px; margin:0 auto; }
    input[type=file]{display:block; margin-bottom:1rem;}
    button{padding:0.5rem 1rem}
    audio{display:block; margin-top:1rem; width:100%;}
    #status{margin-top:1rem; color:#333}
  </style>
</head>
<body>
  <div class="box">
    <h2>Phone Audio Continue (Termux Demo)</h2>
    <p>Upload a short MP3/MP4 snippet (3-15s). The demo will repeat/modify the last few seconds and add a short synthesized continuation.</p>
    <input id="file" type="file" accept="audio/*,video/*" />
    <button id="upload">Upload & Process</button>
    <div id="status"></div>
    <div id="result"></div>
    <hr />
    <h4>Consent & Safety</h4>
    <p>Please ensure you have explicit consent from the person whose voice is used. See README for more details.</p>
  </div>
  <script src="script.js"></script>
</body>
</html>
